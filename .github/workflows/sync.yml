name: Sync Model Matrix

on:
  schedule:
    # Run every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  sync:
    name: Sync Matrix & Upload to R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh website-sourced seeds via agent
        # Best-effort: fetches Cursor/OpenCode/CursorBench docs pages and
        # extracts pricing/benchmark rows with an OpenRouter model into the
        # bundled seeds. Skips cleanly without a key; never blocks the sync.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REFRESH_MODEL: ${{ vars.REFRESH_MODEL }}
          REFRESH_REASONING_EFFORT: ${{ vars.REFRESH_REASONING_EFFORT }}
        run: python3 scripts/agent_refresh.py

      - name: Run matrix sync
        env:
          OPENROUTER_REFRESH: "1"
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AA_CATALOG_PATH: ${{ vars.AA_CATALOG_PATH }}
          CURSOR_MODELS_CSV: ${{ vars.CURSOR_MODELS_CSV }}
        run: npm run sync

      - name: Verify test suite against new matrix
        run: npm test

      - name: Upload matrix to R2 (archives previous latest)
        # Generated files live in the S3-compatible bucket, not git: the site
        # reads them at runtime, so no commit and no rebuild is needed.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: |
          set -euo pipefail
          aws --version
          S3_BASE="s3://${R2_BUCKET}/${R2_PREFIX:-effiq}"

          # Archive the previous latest under its own generatedAt timestamp.
          PREV_TS=""
          if aws s3 cp "${S3_BASE}/latest/sync-manifest.json" /tmp/prev-manifest.json --only-show-errors; then
            PREV_TS=$(python3 -c "import json; print(json.load(open('/tmp/prev-manifest.json')).get('generatedAt',''))" 2>/dev/null || true)
          fi

          if [ -n "$PREV_TS" ]; then
            echo "Archiving previous latest under archive/${PREV_TS}"
            for f in models-matrix.json models-matrix.csv sync-manifest.json; do
              aws s3 cp "${S3_BASE}/latest/$f" "${S3_BASE}/archive/${PREV_TS}/$f" --only-show-errors
            done
          else
            echo "No previous latest on the bucket; skipping archive (first run)"
          fi

          aws s3 cp data/models-matrix.json "${S3_BASE}/latest/models-matrix.json" \
            --content-type "application/json" --cache-control "public, max-age=300"
          aws s3 cp data/models-matrix.csv "${S3_BASE}/latest/models-matrix.csv" \
            --content-type "text/csv" --cache-control "public, max-age=300"
          aws s3 cp data/sync-manifest.json "${S3_BASE}/latest/sync-manifest.json" \
            --content-type "application/json" --cache-control "public, max-age=300"

          echo "Fresh matrix uploaded to ${S3_BASE}/latest/"
